<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.52" stop-color="#07101f"/>
      <stop offset="1" stop-color="#040611"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79b8ff"/>
      <stop offset="0.5" stop-color="#26456e"/>
      <stop offset="1" stop-color="#b78cff"/>
    </linearGradient>
    <linearGradient id="beam" x1="120" y1="440" x2="330" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b78cff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#b78cff" stop-opacity="0.37"/>
      <stop offset="1" stop-color="#79b8ff" stop-opacity="0.24"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f7d38a" stop-opacity="0.37"/>
      <stop offset="1" stop-color="#f7d38a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <line x1="124" y1="432" x2="336" y2="182" stroke="url(#beam)" stroke-width="14" stroke-linecap="round"/>

  <!-- pixel comet trail: lower-left tail -> upper-right head -->
  <rect x="119" y="421" width="14" height="14" rx="2.5" fill="#98a7c2" opacity="0.37"/>
  <rect x="140" y="386" width="22" height="22" rx="4" fill="#b78cff" opacity="0.55"/>
  <rect x="165" y="344" width="34" height="34" rx="5.4" fill="#b78cff" opacity="0.80"/>
  <rect x="196" y="290" width="50" height="50" rx="7" fill="#79b8ff" opacity="0.92"/>
  <rect x="237" y="221" width="70" height="70" rx="8.4" fill="#f7d38a" opacity="0.94"/>
  <rect x="288" y="126" width="104" height="104" rx="10.4" fill="#ffe6b8"/>

  <!-- head glow + bright core -->
  <circle cx="340" cy="178" r="190" fill="url(#glow)"/>
  <rect x="308" y="146" width="64" height="64" rx="8" fill="#fff6dd"/>
</svg>
